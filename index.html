<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sijo Joseph · Semester work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Cormorant+Infant:wght@300&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111;--mut:#9a9a9a;--line:#e8e8e6;--blue:#2f5f9e;--pad:clamp(20px,4vw,64px)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .small{font-size:11px;letter-spacing:.04em;text-transform:uppercase;line-height:1.6}
  .mut{color:var(--mut)}

  /* One screen. The only scroll is sideways. */
  #scroller{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:none}
  #scroller::-webkit-scrollbar{display:none}
  #track{position:relative;height:100%}

  /* Home panel: name + index (left), bag (right) */
  .home{position:absolute;left:0;top:0;height:100%;padding:var(--pad);display:flex;flex-direction:column;justify-content:space-between}
  h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(64px,10.5vw,168px);line-height:.92;letter-spacing:-.035em;padding-bottom:.06em}
  h1{font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;cursor:default;white-space:nowrap;width:max-content;font-size:calc(var(--fs,1) * clamp(64px,10.5vw,168px))}
  h1 .ln{display:block;white-space:pre}
  h1 .d{font-family:"Cormorant Infant","Cormorant Garamond",serif}
  h1{display:flex;flex-direction:column;justify-content:flex-end}
  .index{display:grid;grid-template-columns:auto 1fr;gap:9px 28px;max-width:460px}
  .index a{display:contents}
  .index a:hover dd{color:var(--blue)}
  .index dt{color:var(--mut)}
  .index dd{font-weight:500}
  .index .main dd{color:var(--blue)}

  .bagimg{position:absolute;object-fit:contain;pointer-events:none}
  .bagback{z-index:0}.bagfront{z-index:2;clip-path:inset(38.6% 0 0 0)}
  .baghit{position:absolute;z-index:4;cursor:pointer;border-radius:12px}
  .baglabel{position:absolute;z-index:5;transform:translateX(-50%);text-align:center;white-space:nowrap}
  .baghit:hover ~ .baglabel b{color:var(--blue)}
  .bagimg{transition:filter .5s ease,opacity .5s ease}
  #track.scan .bagback,#track.scan .bagfront{filter:grayscale(1) invert(1) sepia(1) saturate(3.5) hue-rotate(185deg) brightness(1.05) contrast(.85)}
  #track.scan .bagback{opacity:.55}
  #track.scan .bagfront{opacity:.38}
  #track.scan .item.home img{filter:grayscale(1) invert(1) sepia(1) saturate(4) hue-rotate(var(--hue,190deg)) brightness(1.04) contrast(.9)}
  .item,.bagimg{transition:opacity .4s ease}

  .item{position:absolute;z-index:1;left:0;top:0;display:block;cursor:pointer}
  .item img{height:100%;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 12px 20px rgba(20,40,80,.16));transition:filter .25s}
  .item:hover img{filter:drop-shadow(0 18px 28px rgba(20,40,80,.3))}
  .item.soon{cursor:default}
  /* x-ray look by default, real photo when highlighted */
  .item img{transition:filter .45s ease,opacity .45s ease}
  .item.on img{filter:grayscale(1) invert(1) sepia(1) saturate(4) hue-rotate(var(--hue,190deg)) brightness(1.04) contrast(.9);opacity:.92}
  .frame{position:absolute;pointer-events:none;z-index:2;transform:translate(-50%,-50%)}
  .frame .bg{position:absolute;inset:0;background:#f5f7fa;opacity:0;transition:opacity .4s ease}
  .frame i{position:absolute;background:#9cc2f0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .frame i.t,.frame i.b{left:-14%;right:-14%;height:1px;transform:scaleX(0)}
  .frame i.t{top:0}.frame i.b{bottom:0}
  .frame i.l,.frame i.r{top:-14%;bottom:-14%;width:1px;transform:scaleY(0)}
  .frame i.l{left:0}.frame i.r{right:0}
  .frame i.b,.frame i.r{transition-delay:.06s}
  .frame .tags{position:absolute;left:0;top:calc(100% + 8px);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .frame .tags span{background:#000;color:#fff;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;line-height:1.4;white-space:nowrap;clip-path:inset(0 100% 0 0);transition:clip-path .45s cubic-bezier(.2,.8,.2,1)}
  .frame .tags span+span{transition-delay:.08s}
  .frame.on .bg{opacity:1}
  .frame.on i{transform:none}
  .frame.on .tags span{clip-path:inset(0 0 0 0)}
  .slotlabel{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;transition:opacity .3s}
  .slotlabel b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:28px;letter-spacing:-.01em;text-transform:none;display:block;margin:6px 0 4px}

  /* Last panel: contact */
  .contact{position:absolute;top:0;height:100%;padding:var(--pad);display:flex;flex-direction:column;justify-content:center;gap:40px}
  .contact p{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(56px,8vw,140px);line-height:.95;letter-spacing:-.02em;text-transform:none}
  .contact .links{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:8px 48px}
  .contact .links a:hover{color:var(--blue)}

  /* Fixed UI */
  .hint{position:fixed;right:var(--pad);bottom:36px;z-index:10;transition:opacity .3s}
  .progress{position:fixed;left:var(--pad);right:var(--pad);bottom:20px;height:1px;background:var(--line);z-index:10}
  .progress i{display:block;height:100%;width:0;background:var(--ink)}

  @media (max-width:800px){
    h1{font-size:clamp(56px,17vw,96px)}
    .index{gap:6px 16px}
    .slotlabel b{font-size:22px}
    .home{justify-content:flex-start;gap:28px}
    .baglabel .dk{display:none}
  }
</style>
</head>
<body>

<div id="scroller">
  <div id="track">
    <section class="home" id="home">
      <h1 id="name" aria-label="Sijo Joseph"><span class="ln">SIJO</span><span class="ln">JOSEPH</span></h1>
      <dl class="index small" id="index"></dl>
    </section>

    <img class="bagimg bagback" id="bagback" src="bag.webp" alt="">
    <img class="bagimg bagfront" id="bagfront" src="bag.webp" alt="Blue everyday carry pouch: Cubby, Design Project 02">
    <a class="baghit" id="baghit" href="javascript:void 0" aria-label="Cubby, the main project"></a>
    <div class="baglabel small" id="baglabel"><b>Cubby</b> <span class="mut">· Design Project 02<span class="dk"> · case study coming soon · hover to look inside</span></span></div>
    <div id="items"></div>

    <section class="contact small" id="contact">
      <p class="thanks">Thank you.</p>
    </section>
  </div>
</div>

<div class="hint small mut" id="hint">Scroll to unpack →</div>
<div class="progress"><i id="bar"></i></div>

<script>
const S = {
pendrive:`<img src="pendrive.png" alt="Pendrive">`,
lipbalm:`<img src="lipbalm.png" alt="Lip balm">`,
notebook:`<img src="notebook.png" alt="Notebook">`,
pen:`<img src="pen.png" alt="Pilot V pen">`,
charger:`<img src="charger.png" alt="Charger">`,
frame:`<img src="glasses.png" alt="Glasses">`,
pencil:`<img src="pencil.png" alt="Pencil">`
};
// Each item = one subject. Edit name / subject / link here. a = [x% inside the bag, tilt]
const ITEMS = [
 {k:'pendrive', item:'Pendrive',    name:'Syntra',             module:'Retail Technology',          link:'syntra/', h:.42, a:[60,-6]},
 {k:'notebook', item:'Notebook',    name:'No-Broker',          module:'Design Management',          link:'nobroker/', h:.78, a:[40,-4]},
 {k:'frame',    item:'Glasses',     name:'SLA III',            module:'Visual Narratives',          link:'sla3/', h:.4,  a:[64,4]},
 {k:'pen',      item:'Pilot V pen', name:'Ather Energy',       module:'Retail Systems & Processes', link:'ather/', h:.78, a:[34,-10]},
 {k:'pencil',   item:'Pencil',      name:'Intro to Materials', module:'Coming soon',                link:'', h:.72, a:[50,8], soon:1},
 {k:'charger',  item:'Charger',     name:'Ergonomics',         module:'Coming soon',                link:'', h:.9,  a:[26,-8], soon:1},
 {k:'lipbalm',  item:'Lip balm',    name:'Thank you',          module:'The end',                  link:'#contact', h:.9, a:[74,-6], about:1},
];
const REAL={pendrive:[6,.79,.5,-8],notebook:[19,.29,.575,-8],frame:[14.5,.62,.46,4],pen:[14,.69,.635,0],pencil:[17.5,.5,.625,6],charger:[11,.46,.5,-6],lipbalm:[7,.8,.62,-4]};
const IDX=[['Design Project 02','Cubby',''],['Retail Technology','Syntra','syntra/'],['Design Management','No-Broker','nobroker/'],['SLA III','Visual Narratives','sla3/'],['Retail Systems','Ather Energy','ather/'],['Intro to Materials','Coming soon',''],['Ergonomics','Coming soon','']];
const $=id=>document.getElementById(id);
$('index').innerHTML=IDX.map(([a,b,l],i)=>`<a ${l?`href="${l}"${/^http/.test(l)?' target="_blank"':''}`:''} class="${i?'':'main'}"><dt>${a}</dt><dd>${b.toUpperCase()}</dd></a>`).join('');

const scroller=$('scroller'),track=$('track');
const els=ITEMS.map((it,n)=>{
  const d=document.createElement('a');d.className='item'+(it.soon?' soon':'');
  if(it.link){d.href=it.link;if(/^http/.test(it.link))d.target='_blank';
    if(it.about)d.addEventListener('click',e=>{e.preventDefault();scroller.scrollTo({left:G.max,behavior:'smooth'})})}
  d.style.setProperty('--hue',['185deg','225deg','195deg','255deg','175deg','275deg','300deg'][n]);
  d.innerHTML=S[it.k];$('items').appendChild(d);
  const l=document.createElement('div');l.className='slotlabel small';
  l.innerHTML=`<span class="mut">${it.about?'':'0'+(n+1)+' · '}${it.item}</span><b>${it.name}</b><span class="mut">${it.module}${it.link&&!it.about?' ↗':''}</span>`;
  track.appendChild(l);it.label=l;
  const f=document.createElement('div');f.className='frame';
  f.innerHTML=`<div class="bg"></div><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><div class="tags"><span>${it.about?'Hello':'2026'}</span><span>${it.name} // ${it.module}</span></div>`;
  track.insertBefore(f,$('items'));it.frame=f;
  const on=v=>{if(v&&!it.out)return;d.classList.toggle('on',v);f.classList.toggle('on',v)};
  d.addEventListener('mouseenter',()=>on(true));d.addEventListener('mouseleave',()=>on(false));
  return d;
});

const d0=e=>{e.classList.remove('on');return true};
const easeOut=t=>1-Math.pow(1-t,3);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let G={max:0};
function layout(){
  const W=innerWidth,H=innerHeight,mob=W<800;
  // Home panel = one screen. Desktop: text left, bag right. Mobile: text top, bag below.
  $('home').style.width=W+'px';
  let BW,bx,by;
  if(mob){const ib=$('index').getBoundingClientRect().bottom+12,avail=H-ib-56;
    BW=Math.min(W*.95,avail/(1.25*.52));bx=(W-BW)/2;by=ib-BW*1.25*.27}
  else{BW=Math.min(W*.5,H*1.05);bx=W-BW-W*.02;by=(H-BW*1.25)/2}
  const BH=BW*1.25;
  for(const id of['bagback','bagfront'])Object.assign($(id).style,{left:bx+'px',top:by+'px',width:BW+'px',height:BH+'px'});
  Object.assign($('baghit').style,{left:bx+BW*.11+'px',top:by+BH*.34+'px',width:BW*.78+'px',height:BH*.43+'px'});
  Object.assign($('baglabel').style,{left:bx+BW/2+'px',top:by+BH*.79+'px'});
  // Items: a row to the right of the home screen, then the contact panel. The row ends there.
  const IH=Math.min(H*(mob?.26:.34),300),slot=mob?W*.8:Math.max(340,W*.26),x0=W;
  const contactW=mob?W:Math.max(560,W*.5);
  const L=x0+ITEMS.length*slot+contactW;
  track.style.width=L+'px';
  Object.assign($('contact').style,{left:(L-contactW)+'px',width:contactW+'px'});
  ITEMS.forEach((it,i)=>{const e=els[i];e.style.height=IH*it.h+'px';
    const cx=x0+i*slot+slot/2;it.end=[cx,H*.44];const R=REAL[it.k],im=e.querySelector('img'),asp=(im.naturalWidth||1)/(im.naturalHeight||1);
    const hpx=IH*it.h,longest=Math.max(hpx,hpx*asp),unit=BW*.78/35;
    it.rs=Math.min(1,R[0]*unit/longest);e.style.width=hpx*asp+'px';it.start=[bx+BW*R[1],by+BH*R[2]];it.a=[0,R[3]];it.ih=hpx;
    const Q=Math.min(slot*.78,IH*1.25);Object.assign(it.frame.style,{left:cx+'px',top:H*.44+'px',width:Q+'px',height:Q+'px'});
    Object.assign(it.label.style,{left:cx+'px',top:H*.44+Q/2+52+'px'});});
  G={W,H,slot,max:L-W};
}
function tick(){
  const x=scroller.scrollLeft,p=G.max?x/G.max:0;
  $('bar').style.width=(p*100)+'%';
  $('hint').style.opacity=x<20?1:0;
  ITEMS.forEach((it,i)=>{const e=els[i];
    // target progress for this item, staggered so they leave one after another
    const tgt=Math.min(1,Math.max(0,x/(G.W*.55)-i*.07));
    it.p=(it.p??tgt)+(tgt-(it.p??tgt))*.14;            // inertia: eases toward the scroll position
    if(Math.abs(it.p-tgt)<.0005)it.p=tgt;
    const t=it.p;
    const lift=easeOut(Math.min(1,t/.3));                // phase 1: rise out of the pocket
    const glide=ease(Math.max(0,(t-.22)/.78));           // phase 2: glide sideways into place
    const topY=it.start[1]-G.H*.2;
    const px=it.start[0]+(it.end[0]-it.start[0])*glide;
    const py=(it.start[1]+(topY-it.start[1])*lift)+(it.end[1]-topY)*glide;
    const sc=it.rs*(1+.12*lift*(1-glide))+(1-it.rs)*glide;
    const rot=it.a[1]*(1-lift)+(i%2?2:-2)*glide+Math.sin(glide*Math.PI)*(i%2?-4:4);
    e.style.transform=`translate(${px}px,${py}px) translate(-50%,-50%) scale(${sc}) rotate(${rot}deg)`;
    it.out=t>.97;e.classList.toggle('home',t<.02);if(!it.out&&d0(e))it.frame.classList.remove('on');e.style.zIndex=t>.02?3:1;it.label.style.opacity=t>.97?1:0;
  });
  requestAnimationFrame(tick);
}
// Scrolling down moves the page to the right. There is nothing below the home screen.
scroller.addEventListener('wheel',e=>{
  const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  e.preventDefault();scroller.scrollLeft+=d;
},{passive:false});
// Phones: a vertical swipe also moves the page sideways
let ty=null,tx=null;
scroller.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;tx=e.touches[0].clientX},{passive:true});
scroller.addEventListener('touchmove',e=>{if(ty===null)return;const y=e.touches[0].clientY,x=e.touches[0].clientX,dy=ty-y,dx=tx-x;
  if(Math.abs(dy)>Math.abs(dx)){e.preventDefault();scroller.scrollLeft+=dy*1.4}ty=y;tx=x},{passive:false});
scroller.addEventListener('touchend',()=>{ty=tx=null});
addEventListener('keydown',e=>{
  const step={ArrowDown:160,ArrowRight:160,ArrowUp:-160,ArrowLeft:-160,PageDown:innerWidth*.8,' ':innerWidth*.8,PageUp:-innerWidth*.8}[e.key];
  if(step!==undefined){e.preventDefault();scroller.scrollBy({left:step,behavior:'smooth'})}
  if(e.key==='Home')scroller.scrollTo({left:0,behavior:'smooth'});
  if(e.key==='End')scroller.scrollTo({left:G.max,behavior:'smooth'});
});
const hit=$('baghit');
hit.addEventListener('mouseenter',()=>{if(scroller.scrollLeft<40)track.classList.add('scan')});
hit.addEventListener('mouseleave',()=>track.classList.remove('scan'));
hit.addEventListener('touchstart',()=>track.classList.toggle('scan'),{passive:true});
scroller.addEventListener('scroll',()=>{if(scroller.scrollLeft>40)track.classList.remove('scan')});
// Name: chiquach-style. On hover every letter flips quickly through a few letters and lands on the new word.
const nameEl=$('name'),lines=[...nameEl.querySelectorAll('.ln')];
const STATES={name:['SIJO','JOSEPH'],en:['SEMESTER 3','JURY']};
const POOL=[...new Set((STATES.name.join('')+STATES.en.join('')).replace(/[^A-Z]/g,''))];
let run=0,cur='name';
// one size for both states, so nothing jumps
function fit(){nameEl.style.setProperty('--fs',1);let w=0;const keep=lines.map(l=>l.textContent);
  for(const k in STATES){lines.forEach((l,i)=>l.textContent=STATES[k][i]);w=Math.max(w,nameEl.scrollWidth)}
  lines.forEach((l,i)=>l.textContent=keep[i]);const max=innerWidth<800?innerWidth*.88:innerWidth*.46;nameEl.style.setProperty('--fs',Math.min(1,max/w))}
function swap(key){
  if(key===cur)return;const id=++run;cur=key;
  const tgt=STATES[key],t0=performance.now();
  const plan=tgt.map((tl,li)=>{const n=Math.max(tl.length,lines[li].textContent.length);return Array.from({length:n},(_,i)=>({end:70+i*28+li*45,flips:0}))});
  (function step(now){if(id!==run)return;const el=now-t0;let done=true;
    lines.forEach((l,li)=>{l.innerHTML=plan[li].map((p,i)=>{const ch=tgt[li][i]??'';if(el>=p.end)return ch;done=false;if(ch===' ')return ' ';
      return el<p.end-140?(l.textContent[i]??''):POOL[(Math.floor(el/45)+i*7+li*3)%POOL.length]}).join('').replace(/\s+$/,'').replace(/(\d)/g,'<span class="d">$1</span>')});
    if(!done)requestAnimationFrame(step)})(t0);
}
nameEl.addEventListener('mouseenter',()=>swap('en'));
nameEl.addEventListener('mouseleave',()=>swap('name'));
let tTimer;nameEl.addEventListener('touchstart',()=>{clearTimeout(tTimer);swap('en');tTimer=setTimeout(()=>swap('name'),2600)},{passive:true});
fit();nameEl.style.height=nameEl.offsetHeight+'px';
addEventListener('resize',fit);
addEventListener('resize',layout);
layout();tick();
document.querySelectorAll('.item img').forEach(im=>im.complete||im.addEventListener('load',layout));
</script>
</body>
</html>
